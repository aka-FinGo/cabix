name: Build FonRo Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip zipalign apksigner

      - name: Build Android APK from Source Resources
        run: |
          mkdir -p build/outputs/apk
          cd FonRo_SourceCode/resources
          zip -r -4 ../../build/outputs/apk/FonRo-POS-unsigned.apk .
          cd ../..
          zipalign -v -p 4 build/outputs/apk/FonRo-POS-unsigned.apk build/outputs/apk/FonRo-POS-aligned.apk
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FonRo,OU=FonRo,O=FonRo,L=Tashkent,C=UZ"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --min-sdk-version 24 --out build/outputs/apk/FonRo-POS-v1.0.apk build/outputs/apk/FonRo-POS-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FonRo-Android-APK
          path: build/outputs/apk/FonRo-POS-v1.0.apk
          if-no-files-found: error
