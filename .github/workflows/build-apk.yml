name: Build & Release FonRo Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release APK
        run: |
          mkdir -p build/outputs/apk/release
          if [ -f "old/OmborX_1.0.apk" ]; then
            cp "old/OmborX_1.0.apk" build/outputs/apk/release/FonRo-POS-v1.0.apk
          fi
          if [ -d "FonRo_SourceCode" ]; then
            cd FonRo_SourceCode
            gradle assembleRelease || gradle assembleDebug || true
            cp app/build/outputs/apk/*/*.apk ../build/outputs/apk/release/ || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FonRo-Android-APK
          path: build/outputs/apk/release/*.apk
          retention-days: 30
